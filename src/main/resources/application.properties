spring.application.name=investigation_case_service
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/investigation_case
spring.datasource.username=postgres
spring.datasource.password=00000000
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=7d
app.security.max-failed-attempts=5
app.security.lock-duration=15m

minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin123
minio.bucket=investigation-files

spring.servlet.multipart.max-file-size: 50MB
spring.servlet.multipart.max-request-size: 50MB

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@investigation.local}

app.password-reset.code-ttl=5m
app.password-reset.max-attempts=5
app.password-reset.resend-interval=1m

# Page отдаётся в стабильном виде: {"content": [...], "page": {...}}
spring.data.web.pageable.serialization-mode=via_dto
