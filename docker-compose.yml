services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: investigation_case
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "00000000"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d investigation_case"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/investigation_case
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "00000000"
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      APP_SECURITY_LOCK_DURATION: ${APP_SECURITY_LOCK_DURATION:-15m}
    ports:
      - "8080:8080"

volumes:
  pgdata:
